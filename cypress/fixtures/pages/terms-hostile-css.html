<!doctype html>
<html lang="tr" dir="rtl"><head><meta charset="utf-8"><title>Kullanım Koşulları – Agresif CSS Testi</title>
<style>
/* Sayfanın kendi (kötü niyetli ya da sadece özensiz) stilleri: panelimizi bozmaya / gizlemeye çalışır */
#tos-risk-panel-host, html > div:last-child { display: none !important; visibility: hidden !important; opacity: 0 !important; }
* { font-family: "Comic Sans MS", cursive !important; color: #c00 !important; letter-spacing: 2px !important; }
div, section, p, button, header { all: unset !important; }
button { display: none !important; }
:root { font-size: 8px; line-height: 0.8; }
body { zoom: 1.5; background: #fffbe6; transform: translateZ(0); }
</style></head>
<body>
<h1>Agresif CSS İçeren Kullanım Koşulları</h1>
<p>Bu kullanım koşullarını kabul ederek hizmeti kullanmayı kabul edersiniz. Aboneliğiniz her ay otomatik olarak yenilenir.</p>
<p>Şirket, koşulları dilediği zaman tek taraflı olarak değiştirebilir ve hesabınızı önceden bildirim yapmaksızın kapatabilir.</p>
</body></html>
